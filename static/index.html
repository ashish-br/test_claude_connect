<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-do</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>To-do</h1>
    <form id="add-form">
      <input id="new-title" type="text" placeholder="What needs doing?" maxlength="200" required>
      <button type="submit">Add</button>
    </form>
    <p id="error" hidden></p>
    <ul id="todo-list"></ul>
    <p id="summary"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
